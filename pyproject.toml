[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "novel-writer"
version = "0.13.0"
description = "AI 小说创作工具：自动生成大纲、人物、章节，专注于减少 AI 味道；内建网文专项题材与爽感文风系统。"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "ai-novel contributors" }]
keywords = ["ai", "novel", "writing", "fiction", "long-form", "minimax", "openai"]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]
web = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
]

[project.urls]
"Source" = "https://github.com/yourname/ai-novel"

[project.scripts]
novel = "novel_cli:app"

[tool.setuptools]
py-modules = ["novel_cli"]

[tool.setuptools.packages.find]
include = ["novel*"]

# ---------- 代码质量：ruff ----------
[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["my_novel/*", "tests/fixtures/*", ".code-review-graph/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",   # 行长度——历史代码较长
    "B008",   # 函数默认值；typer 大量使用
]

[tool.ruff.lint.per-file-ignores]
"novel_cli.py" = ["B008", "E402"]
"tests/*" = ["B011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------- 测试：pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: 标记耗时测试（默认跳过）",
    "network: 需要网络访问（默认跳过）",
]